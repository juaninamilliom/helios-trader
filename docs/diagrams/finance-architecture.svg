<rect class="node" x="985" y="847" width="330" height="103" rx="16"/>
<text class="title" x="1150" y="888" text-anchor="middle">TypeSafe · Jev</text>
<text class="body" x="1150" y="922" text-anchor="middle">Direct alternative</text>
<rect class="node" x="1340" y="847" width="365" height="103" rx="16"/>
<text class="title" x="1522" y="888" text-anchor="middle">OpenRouter</text>
<text class="body" x="1522" y="922" text-anchor="middle">Optional Jev / Luna transport</text>
<text class="sub" x="65" y="1030">Architecture shows available routes, not proof of live provider access or model accuracy.</text>
<text class="sub" x="65" y="1067">Separate fictional demo · No trading or money movement in the finance entry</text>
</svg>
